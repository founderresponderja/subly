services:
  postgres:
    image: postgres:16-alpine
    container_name: subly-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: subly_dev
      POSTGRES_PASSWORD: subly_dev
      POSTGRES_DB: subly
    volumes:
      - subly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subly_dev -d subly"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  subly_postgres_data:
